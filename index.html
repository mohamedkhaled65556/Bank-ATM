<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Bank</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.css"
      integrity="sha512-phGxLIsvHFArdI7IyLjv14dchvbVkEDaH95efvAae/y2exeWBQCQDpNFbOTdV1p4/pIa/XtbuDCnfhDEIXhvGQ=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section>
      <div class="Bank">
        <i class="fa-solid fa-building-columns"></i> Bank ATM
      </div>
      <div class="modalBody" id="PasswordModal">
        <div
          class="animate__animated animate__fadeInUp bg-gradient p-4 rounded-3 d-flex flex-column gap-3"
        >
          <button id="btn2" onclick="closeModal()">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
          <h2 class="text-center">Verification Password</h2>
          <h5 class="text-center">Enter 6 digits</h5>
          <div class="justify-content-between">
            <input id="otp1" class="otp-input" type="password" maxlength="1" />
            <input id="otp2" class="otp-input" type="password" maxlength="1" />
            <input id="otp3" class="otp-input" type="password" maxlength="1" />
            <input id="otp4" class="otp-input" type="password" maxlength="1" />
            <input id="otp5" class="otp-input" type="password" maxlength="1" />
            <input id="otp6" class="otp-input" type="password" maxlength="1" />
          </div>
          <div class="text-center">
            <button id="btn1" onclick="verifyPassword()">Verify</button>
          </div>
        </div>
      </div>
      <div class="text-end">
        <span id="Register">
          <button class="btn btn-danger" id="btn3" onclick="openModal()">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in
          </button>
        </span>
        <div class="modalBody1" id="changePasswordModal">
          <div
            class="animate__animated animate__fadeInUp bg-gradient p-4 rounded-3 d-flex flex-column gap-3"
          >
            <button id="btn2" onclick="closeModal()">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
            <h2 class="text-center">Changing Password</h2>
            <h5 class="text-center">Enter 6 digits</h5>
            <div class="justify-content-between">
              <input
                id="otp01"
                class="otp-input"
                type="password"
                maxlength="1"
              />
              <input
                id="otp02"
                class="otp-input"
                type="password"
                maxlength="1"
              />
              <input
                id="otp03"
                class="otp-input"
                type="password"
                maxlength="1"
              />
              <input
                id="otp04"
                class="otp-input"
                type="password"
                maxlength="1"
              />
              <input
                id="otp05"
                class="otp-input"
                type="password"
                maxlength="1"
              />
              <input
                id="otp06"
                class="otp-input"
                type="password"
                maxlength="1"
              />
            </div>
            <div class="text-center">
              <button id="btn1" onclick="editPassword()">Change</button>
            </div>
          </div>
        </div>
        <button
          type="button"
          id="btn3"
          class="btn btn-secondary"
          onclick="changePassword()"
        >
          <i class="fa-solid fa-key"></i> Change Password
        </button>
      </div>
      <div id="ShowBalance" class="text-center mt-3">
        <h3>Balance is <span id="Balance">**** EGP</span></h3>
        <button
          type="button"
          class="btn btn-primary"
          id="btn4"
          onclick="showAndHideBalance()"
        >
          Show/Hide Balance
        </button>
      </div>
      <div class="text-center mt-4">
        <input
          placeholder="Enter amount"
          id="Deposite"
          class="btn btn-outline-success w-auto"
          type="number"
        />
        <button class="btn btn-success" onclick="Deposite()">
          <i class="fa-solid fa-circle-dollar-to-slot"></i> Deposite
        </button>
      </div>
      <div class="text-center mt-3">
        <input
          placeholder="Enter amount"
          id="Withdraw"
          class="btn btn-outline-danger w-auto"
          type="number"
        />
        <button class="btn btn-danger" onclick="Withdraw()">
          <i class="fa-solid fa-coins"></i> Withdraw
        </button>
      </div>
      <div class="table">
        <table class="table table-borderless text-center mt-5">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Balance Before</th>
              <th scope="col">Transaction</th>
              <th scope="col">Balance After</th>
            </tr>
          </thead>
          <tbody id="Transaction"></tbody>
        </table>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
